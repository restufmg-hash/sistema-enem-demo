<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sistema ENEM — questão pública do ENEM (INEP), sem gabarito exposto">
<title>Sistema ENEM — Questão</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f5f7; color: #17181c; line-height: 1.5; }
  header { background: #0d2b45; color: #fff; padding: 1rem 1.25rem; }
  header h1 { margin: 0; font-size: 1.1rem; font-weight: 650; letter-spacing: .02em; }
  header a { color: #bcd3e8; text-decoration: none; font-size: .85rem; }
  main { max-width: 880px; margin: 1.25rem auto; padding: 0 1rem; }
  .card { background: #fff; border-radius: 12px; padding: 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .meta { color: #4a5568; font-size: .85rem; margin: 0 0 .75rem; }
  .meta strong { color: #0d2b45; }
  .badge { display: inline-block; background: #8b5200; color: #fff; border-radius: 6px; padding: .1rem .5rem; font-size: .75rem; font-weight: 700; margin-left: .4rem; vertical-align: middle; }
  figure { margin: 1rem 0; }
  #conteudo-estruturado p { margin: .85rem 0; white-space: pre-wrap; }
  #conteudo-estruturado [data-role="title"] { font-size: 1.05rem; font-weight: 700; text-align: center; }
  #conteudo-estruturado [data-role="verse"] { padding: 0 .65rem; line-height: 1.45; }
  #conteudo-estruturado [data-role="reference"] { font-size: .83rem; text-align: right; }
  #conteudo-estruturado [data-role="stem"] { font-weight: 500; }
  #conteudo-estruturado figure { margin: 1rem auto; max-width: 560px; }
  #conteudo-estruturado img { display: block; max-width: 100%; height: auto; margin: auto; }
  #alternar-original { font-size: .85rem; background: #e7edf3; color: #173c59; padding: .45rem .8rem; margin-top: .25rem; }
  @media(max-width: 460px) { main { padding: 0 .55rem; } .card { padding: .85rem; } label.option { padding: .65rem; } }
  figure img { max-width: 100%; height: auto; border: 1px solid #e2e5ea; border-radius: 8px; }
  figcaption { font-size: .8rem; color: #4a5568; margin-top: .4rem; }
  fieldset { border: 0; padding: 0; margin: 1rem 0 0; }
  legend { font-weight: 600; margin-bottom: .5rem; }
  label.option { display: block; border: 1px solid #d6dbe3; border-radius: 10px; padding: .65rem .8rem; margin: .45rem 0; cursor: pointer; transition: border-color .15s, background .15s; }
  label.option:hover { border-color: #0d2b45; background: #f7fafd; }
  label.option input { margin-right: .6rem; }
  button { background: #0d2b45; color: #fff; border: 0; border-radius: 10px; padding: .7rem 1.4rem; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: .5rem; }
  button:hover { background: #14405f; }
  #resultado { margin-top: 1rem; padding: .75rem .9rem; border-radius: 10px; font-weight: 600; display: none; background: #eef2f7; color: #2d3748; border: 1px solid #cbd5e0; }
  #resultado.ok { background: #ecf8ef; color: #1e5b2a; border-color: #b6dfc2; }
  #resultado.erro { background: #fdf0ee; color: #7a2415; border-color: #f2c0b3; }
  footer { max-width: 880px; margin: 1rem auto 2rem; padding: 0 1rem; font-size: .72rem; color: #718096; overflow-wrap: anywhere; }
  /* A mesma representação semântica é composta na geometria da página original. */
  .pagina-main { max-width: 1100px; }
  .pagina-mode { padding: 1rem; }
  .pagina-tools { display:flex;align-items:center;gap:.7rem;flex-wrap:wrap; }
  .pagina-tools strong { font-size:1rem; }
  .pagina-tools p { margin:0;flex-basis:100%;font-size:.88rem;color:#455468; }
  .pagina-stage { width:100%;overflow-x:auto;overscroll-behavior-x:contain;margin-top:.8rem; }
  .pagina-zoom-wrap {position:relative;margin:0 auto;}
  .pagina-folha { position:absolute;top:0;left:0;transform-origin:top left;width:900px;min-height:1130px;margin:0 auto;background:white;border:1px solid #b7bbc5;
    padding:28px 18px;display:grid;grid-template-columns:1fr 1fr;gap:15px 18px;
    grid-template-rows:auto 1fr;align-items:start;font-family:Arial,sans-serif; }
  .pagina-questao { min-width:0; }
  .pagina-q1 { grid-column:1;grid-row:1 / span 2; }
  .pagina-q2 { grid-column:2;grid-row:1; }
  .pagina-q3 { grid-column:2;grid-row:2; }
  .pagina-questao h2 { font-size:.93rem;display:flex;align-items:center;justify-content:space-between;margin:4px 0 9px; }
  .pagina-questao-link,.pagina-link { font-size:.78rem;font-weight:500; }
  .pagina-blocos { font-size:.79rem;line-height:1.35;white-space:pre-wrap; }
  .pagina-blocos p { margin:.5rem 0; }
  .pagina-blocos [data-role="reference"] {font-size:.72rem;text-align:right;}
  .pagina-blocos [data-role="title"] {font-weight:700;text-align:center;}
  .pagina-blocos figure {margin:5px 0;}
  .pagina-blocos img {width:100%;height:auto;max-width:100%;}
  .pagina-tentativa {font-size:.76rem;}
  .pagina-tentativa fieldset {border:0;padding:0;margin:5px 0;min-width:0;}
  .pagina-tentativa legend {font-weight:600;}
  .pagina-tentativa fieldset label {display:block;margin:3px 0;cursor:pointer;}
  .pagina-tentativa fieldset:nth-child(2) label {display:inline-flex;gap:2px;margin-right:9px;}
  .pagina-tentativa button {font-size:.78rem;padding:.35rem .6rem;border-radius:5px;}
  .pagina-tentativa button:disabled {opacity:.55;cursor:default;}
  .pagina-resultado {font-size:.76rem;font-weight:600;}
  .pagina-link {display:inline-block;margin-bottom:.5rem;}
  .pagina-p3 .pagina-q4 {grid-column:1;grid-row:1;}
  .pagina-p3 .pagina-q5 {grid-column:1;grid-row:2;}
  .pagina-p3 .pagina-q1 {grid-column:2;grid-row:1 / span 2;}
  .pagina-p3 .pagina-blocos [data-role="passage"] {text-align:justify;}
  .pagina-p3 .pagina-blocos [data-role="section"] {font-size:.78rem;font-weight:650;}
  .pagina-p4 .pagina-q2 {grid-column:1;grid-row:1;}
  .pagina-p4 .pagina-q3 {grid-column:1;grid-row:2;}
  .pagina-p4 .pagina-q4 {grid-column:2;grid-row:1;}
  .pagina-p4 .pagina-q5 {grid-column:2;grid-row:2;}
  .pagina-p4 .pagina-blocos [data-role="passage"] {text-align:justify;}
  .pagina-p4 .pagina-blocos [data-role="verse"] {white-space:pre-wrap;line-height:1.3;padding-left:1rem;}
  /* Página 5: segunda coluna começa com a continuação real da Q007.
     Todos os textos e alternativas vêm dos mesmos dados do modo questão. */
  .pagina-p5 {position:absolute;display:block;min-height:1260px;}
  .pagina-p5-head {position:absolute;top:12px;left:20px;width:415px;font-size:.79rem;font-weight:700;}
  .pagina-p5 .pagina-questao {position:absolute;width:calc(50% - 29px);font-size:.75rem;}
  .pagina-p5 .pagina-q6 {top:56px;left:20px;}
  .pagina-p5 .pagina-q7-left {top:742px;left:20px;}
  .pagina-p5 .pagina-q7-continued {top:34px;right:20px;}
  .pagina-p5 .pagina-q8 {top:585px;right:20px;}
  .pagina-p5 .pagina-blocos {font-size:.76rem;line-height:1.31;}
  .pagina-p5 .pagina-blocos p {margin:.45rem 0;}
  .pagina-p5 .pagina-blocos [data-role="passage"] {text-align:justify;}
  .pagina-p5 .pagina-blocos [data-role="title"] {font-size:.84rem;}
  .pagina-p5 .pagina-tentativa {font-size:.71rem;line-height:1.25;}
  .pagina-p5 .pagina-tentativa fieldset label {margin:2px 0;}
  .pagina-p5 .pagina-tentativa button {padding:.28rem .4rem;font-size:.73rem;}
  .pagina-p5 .pagina-q7-continued .pagina-blocos p:first-child {margin-top:0;}
  .pagina-p5 .pagina-questao h2 {margin:3px 0 8px;font-size:.85rem;}

  /* Página 6: Q009 acima de Q010 na esquerda; Q011 integral à direita.
     Não usa PDF ou screenshot de fundo: blocos dos mesmos student JSON. */
  .pagina-p6 { min-height:1170px; grid-template-rows:auto 1fr; }
  .pagina-p6 .pagina-q9 { grid-column:1;grid-row:1; }
  .pagina-p6 .pagina-q10 { grid-column:1;grid-row:2; }
  .pagina-p6 .pagina-q11 { grid-column:2;grid-row:1 / span 2; }
  .pagina-p6 .pagina-blocos { font-size:.78rem;line-height:1.32; }
  .pagina-p6 .pagina-blocos p { margin:.43rem 0; }
  .pagina-p6 .pagina-blocos [data-role="passage"] { text-align:justify; }
  .pagina-p6 .pagina-tentativa {font-size:.72rem;line-height:1.25;}
  .pagina-p6 .pagina-tentativa fieldset label { margin:2px 0; }
  .pagina-p6 .pagina-tentativa button {font-size:.72rem;padding:.3rem .45rem;}

  /* Página 7: a Q013 atravessa o limite esquerdo→direito tal como no INEP.
     As três questões usam os mesmos dados estruturados que o modo individual. */
  .pagina-p7 { position:absolute; display:block; min-height:1270px; }
  .pagina-p7 .pagina-questao { position:absolute;width:calc(50% - 29px);font-size:.75rem; }
  .pagina-p7 .pagina-q12 { top:54px;left:20px; }
  .pagina-p7 .pagina-q13-left { top:795px;left:20px; }
  .pagina-p7 .pagina-q13-continued { top:51px;right:20px; }
  .pagina-p7 .pagina-q14 { top:556px;right:20px; }
  .pagina-p7 .pagina-blocos {font-size:.75rem;line-height:1.30;}
  .pagina-p7 .pagina-blocos p {margin:.42rem 0;}
  .pagina-p7 .pagina-blocos [data-role="passage"] {text-align:justify;}
  .pagina-p7 .pagina-tentativa {font-size:.71rem;line-height:1.24;}
  .pagina-p7 .pagina-tentativa fieldset label {margin:2px 0;}
  .pagina-p7 .pagina-tentativa button {padding:.28rem .43rem;font-size:.72rem;}
</style>
</head>
<body>
<header><h1>Sistema ENEM</h1><a href="index.html">&larr; Índice de questões</a></header>
<main>
  <div class="card" id="card">
    <p class="meta" id="meta">Carregando…</p>
    <div id="conteudo-estruturado" aria-label="Enunciado estruturado" hidden></div>
    <figure id="figura_texto" hidden>
      <img id="enunciado_texto" alt="">
      <figcaption>Texto-base compartilhado (autoria INEP), exibido sem qualquer alteração.</figcaption>
    </figure>
    <figure id="figura" hidden>
      <img id="enunciado" alt="">
      <figcaption>Imagem oficial integral da questão (autoria INEP), exibida sem qualquer alteração.</figcaption>
    </figure>
    <button id="alternar-original" type="button" hidden>Consultar recorte original</button>
    <form id="form-resposta" aria-label="Registrar resposta" hidden>
      <fieldset>
        <legend>Selecione uma alternativa</legend>
        <div id="alternativas"></div>
      </fieldset>
      <fieldset>
        <legend>Sua confiança</legend>
        <div id="confianca" style="display:flex; gap:.4rem; flex-wrap:wrap"></div>
      </fieldset>
      <button type="submit">Registrar minha resposta</button>
    </form>
    <div id="resultado" role="status" aria-live="polite"></div>
  </div>
</main>
<footer>
  <p id="fonte">Fonte oficial: INEP.</p>
  <p>A alternativa correta não é exibida nem conferida nesta página; a conferência acontece no sistema, no servidor.</p>
</footer>
<script src="config.js"></script>
<script>
const SILENCIADO = {
  api: (window.SISTEMA_ENEM_API || "").trim(),
  readApi: (window.SISTEMA_ENEM_ATTEMPTS_READ_API || "").trim()
};

function mostrar(el, visivel) { el.hidden = !visivel; }

function intOrUndef(v) {
  if (v === null || v === undefined) return undefined;
  const s = String(v).trim();
  if (!s) return undefined;
  const n = Number(s);
  return Number.isFinite(n) ? n : undefined;
}

const IDIOMA_ALIASES = {
  "english": "en",
  "en": "en",
  "espanol": "es",
  "español": "es",
  "es": "es",
  "portugues": "pt",
  "português": "pt",
  "pt-br": "pt",
  "pt": "pt"
};

function normIdioma(v) {
  const s = String(v || "").trim().toLowerCase();
  if (!s) return "";
  return IDIOMA_ALIASES[s] || s;
}

function acharItemPorId(items, id) {
  if (!id) return { item: null, matches: [] };
  const direct = items.find((i) => i.id === id || i.question_id === id);
  if (direct) return { item: direct, matches: [direct] };
  const byAlias = items.filter((i) => (i.aliases || []).includes(id));
  if (byAlias.length === 1) return { item: byAlias[0], matches: byAlias };
  return { item: null, matches: byAlias };
}

function filtrarPorOcorrencia(items, occ) {
  const matches = items.filter((i) => {
    const o = i.occurrence || {};
    const campos = [];
    if (occ.ano) campos.push(() => String(o.ano) === String(occ.ano));
    if (occ.dia) campos.push(() => String(o.dia) === String(occ.dia));
    if (occ.caderno) campos.push(() => String(o.caderno || "") === String(occ.caderno));
    if (occ.cor) campos.push(() => String(o.cor || "") === String(occ.cor));
    if (occ.idioma) campos.push(() => String(o.idioma || "") === String(occ.idioma));
    if (occ.numero) campos.push(() => String(o.numero_oficial) === String(occ.numero));
    return campos.every((c) => c());
  });
  return matches;
}

function descreverItem(i) {
  const o = i.occurrence || {};
  const idioma = o.idioma ? " (" + o.idioma + ")" : "";
  return "Questão " + (o.numero_oficial != null ? o.numero_oficial : i.numero_oficial) + idioma + " · " + (i.prova || "");
}

function falha(mensagem) {
  const meta = document.getElementById("meta");
  meta.textContent = mensagem;
  mostrar(document.getElementById("figura"), false);
  mostrar(document.getElementById("figura_texto"), false);
  mostrar(document.getElementById("conteudo-estruturado"), false);
  mostrar(document.getElementById("alternar-original"), false);
  mostrar(document.getElementById("form-resposta"), false);
}

function primeiraChave(questionId) { return "sistema_enem_primeira_" + questionId; }

function sessaoAnonima() {
  try {
    let s = localStorage.getItem("sistema_enem_anon_session");
    if (!s) {
      s = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(16).slice(2));
      localStorage.setItem("sistema_enem_anon_session", s);
    }
    return s;
  } catch (_) { return undefined; }
}

function idTentativa(questionId) {
  // Um clique = um envio; o mesmo UUID e reutilizado em reenvios da mesma submissao
  // (falha de rede), garantindo idempotencia no servidor. Liberado apos sucesso.
  const chave = "sistema_enem_attempt_" + questionId;
  const novo = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(16).slice(2));
  try {
    let s = sessionStorage.getItem(chave);
    if (!s) { s = novo(); sessionStorage.setItem(chave, s); }
    return { id: s, chave };
  } catch (_) { return { id: novo(), chave: null }; }
}

// Único renderizador de blocos para visão fluida e visão paginada.
function renderizarBlocosComuns(container, blocks) {
  container.textContent = "";
  for (const block of blocks) {
      if (block.type === "image") {
        const figure = document.createElement("figure");
        const source = document.createElement("img");
        // Only first-party, relative media paths: never arbitrary external URLs.
        if (!/^assets\/[a-zA-Z0-9_.-]+\.(png|jpg|jpeg|webp)$/i.test(block.asset || "")) {
          throw new Error("Mídia da questão indisponível ou não autorizada.");
        }
        source.src = block.asset;
        source.alt = block.text || "Ilustração do enunciado";
        figure.appendChild(source);
        container.appendChild(figure);
      } else if (["text", "math", "table"].includes(block.type)) {
        const part = document.createElement(block.type === "table" ? "pre" : "p");
        if (["title", "verse", "reference", "stem"].includes(block.role)) {
          part.dataset.role = block.role;
        }
        // Render validated emphasis as DOM text nodes, never as injected HTML.
        let remainder = block.text || "";
        const marks = Array.isArray(block.emphasize) ? block.emphasize : [];
        for (const phrase of marks) {
          if (typeof phrase !== "string" || !phrase || !remainder.includes(phrase)) continue;
          const index = remainder.indexOf(phrase);
          part.appendChild(document.createTextNode(remainder.slice(0, index)));
          const emphasis = document.createElement("em");
          emphasis.textContent = phrase;
          part.appendChild(emphasis);
          remainder = remainder.slice(index + phrase.length);
        }
        part.appendChild(document.createTextNode(remainder));
        container.appendChild(part);
      }
    }
}

const CONFIG_PAGINAS_2024_D1 = {
  2: {ano:2024,dia:1,caderno:"cdazul",idioma:"en",pagina:2,
      questoes:[{numero:1,idioma:"en"},{numero:2,idioma:"en"},{numero:3,idioma:"en"}]},
  3: {ano:2024,dia:1,caderno:"cdazul",idioma:"mixed",pagina:3,
      questoes:[{numero:4,idioma:"en"},{numero:5,idioma:"en"},{numero:1,idioma:"es"}]},
  4: {ano:2024,dia:1,caderno:"cdazul",idioma:"es",pagina:4,
      questoes:[{numero:2,idioma:"es"},{numero:3,idioma:"es"},{numero:4,idioma:"es"},{numero:5,idioma:"es"}]},
  5: {ano:2024,dia:1,caderno:"cdazul",idioma:"pt",pagina:5,
      questoes:[{numero:6,idioma:"pt"},{numero:7,idioma:"pt"},{numero:8,idioma:"pt"}]},
  6: {ano:2024,dia:1,caderno:"cdazul",idioma:"pt",pagina:6,
      questoes:[{numero:9,idioma:"pt"},{numero:10,idioma:"pt"},{numero:11,idioma:"pt"}]},
  7: {ano:2024,dia:1,caderno:"cdazul",idioma:"pt",pagina:7,
      questoes:[{numero:12,idioma:"pt"},{numero:13,idioma:"pt"},{numero:14,idioma:"pt"}]}
};

function linkDaPagina(item) {
  const o = item.occurrence || {};
  for(const config of Object.values(CONFIG_PAGINAS_2024_D1)) {
    if(Number(o.ano)===2024 && Number(o.dia)===1 && o.caderno==="cdazul" &&
      Number(item.pagina)===config.pagina &&
      config.questoes.some((q)=>q.numero===Number(o.numero_oficial) && q.idioma===normIdioma(o.idioma))) {
      return "questao.html?pagina="+config.pagina+"&ano=2024&dia=1&caderno=cdazul&idioma="+config.idioma;
    }
  }
  return null;
}

async function abrirPaginaEstruturada(items,c) {
  const selecionados = c.questoes.map(({numero,idioma}) => {
    const v = items.filter((item) => {
      const o = item.occurrence || {};
      return Number(o.ano) === c.ano && Number(o.dia) === c.dia &&
        o.caderno === c.caderno && normIdioma(o.idioma) === idioma &&
        Number(item.pagina) === c.pagina && Number(o.numero_oficial) === numero;
    });
    if (v.length !== 1) throw new Error("Ocorrência ambígua ou ausente da página " + numero);
    return v[0];
  });
  const response = await Promise.all(selecionados.map(async (item) => {
    const r = await fetch(item.data, {cache:"no-store"});
    if (!r.ok) throw new Error("Dados indisponíveis da questão " + item.numero_oficial);
    const dados = await r.json();
    if (!Array.isArray(dados.blocks) || !dados.blocks.length ||
        !Array.isArray(dados.options) || dados.options.length !== 5) {
      throw new Error("Reconstrução estruturada incompleta");
    }
    return {item,dados};
  }));
  document.title = "Sistema ENEM — Página " + c.pagina + " · 2024 D1 Azul";
  const header = document.createElement("div");
  header.className = "pagina-tools";
  const title=document.createElement("strong");
  title.textContent="Página original "+c.pagina+" · Linguagens · "+(c.pagina===2?"Opção inglês":c.pagina===4?"Opção espanhol":(c.pagina>=5)?"Língua portuguesa":"Inglês e espanhol");
  header.append(title);
  const description = document.createElement("p");
  description.textContent = "Reconstrução interativa da página impressa do INEP. As mesmas questões e mídias do modo individual. A visualização do original serve apenas para conferência.";
  const zoom = document.createElement("input");
  zoom.type = "range"; zoom.min = "35"; zoom.max = "160"; zoom.value = window.innerWidth < 650 ? "38" : "100";
  zoom.id = "zoom-pagina"; zoom.setAttribute("aria-label","Zoom da página em porcentagem");
  const percent = document.createElement("output"); percent.htmlFor = "zoom-pagina"; percent.textContent = zoom.value + "%";
  header.append(description, zoom, percent);
  const stage = document.createElement("div"); stage.className = "pagina-stage";
  const zoomWrap = document.createElement("div"); zoomWrap.className="pagina-zoom-wrap";
  const sheet = document.createElement("div"); sheet.className = "pagina-folha";
  zoomWrap.append(sheet); stage.append(zoomWrap);
  sheet.classList.add("pagina-p"+c.pagina);
  function atualizarZoom() {
    const escala = Number(zoom.value) / 100;
    sheet.style.transform = "scale(" + escala + ")";
    zoomWrap.style.width = (900 * escala) + "px";
    zoomWrap.style.height = (sheet.scrollHeight * escala) + "px";
    percent.textContent = zoom.value + "%";
  }
  zoom.addEventListener("input", atualizarZoom);
  // Layout reproduz a ordem original em duas colunas; sem PDF como background.
  for (const {item,dados} of response) {
    const numero = Number(item.numero_oficial);
    const section = document.createElement("section");
    section.className = "pagina-questao pagina-q" + numero;
    section.setAttribute("aria-label", "Questão " + numero);
    const h = document.createElement("h2");
    h.textContent = "QUESTÃO " + String(numero).padStart(2,"0");
    const link = document.createElement("a");
    link.href = "questao.html?id=" + encodeURIComponent(item.question_id);
    link.textContent = "Abrir questão";
    link.className = "pagina-questao-link";
    h.append(link);
    const content = document.createElement("div");
    content.className = "pagina-blocos";
    renderizarBlocosComuns(content, dados.blocks);
    const form = document.createElement("form");
    form.className = "pagina-tentativa";
    const field = document.createElement("fieldset");
    const legend = document.createElement("legend");legend.textContent="Alternativa";
    field.append(legend);
    for (const opt of dados.options) {
      const l = document.createElement("label");
      const input = document.createElement("input");
      input.type = "radio";input.name = "alternativa";input.value=opt.label;
      input.setAttribute("aria-label","Questão "+numero+" alternativa "+opt.label);
      l.append(input,document.createTextNode(opt.label+" — "+opt.text));
      field.append(l);
    }
    const confidenceField = document.createElement("fieldset");
    const legend2 = document.createElement("legend");legend2.textContent="Confiança";
    confidenceField.append(legend2);
    for(let level=1; level<=5; level++) {
      const l = document.createElement("label");
      const input = document.createElement("input");
      input.type="radio"; input.name="confianca"; input.value=String(level);
      input.setAttribute("aria-label","Questão "+numero+" confiança "+level);
      l.append(input,document.createTextNode(String(level)));confidenceField.append(l);
    }
    const submit = document.createElement("button");
    submit.type = "submit"; submit.textContent="Registrar resposta";
    const status = document.createElement("p");status.className="pagina-resultado";status.setAttribute("role","status");
    form.append(field,confidenceField,submit,status);
    const key = "sistema_enem_recibo_"+item.question_id;
    const pending = "sistema_enem_rascunho_"+item.question_id;
    const old = JSON.parse(localStorage.getItem(pending)||"null");
    if(old){
      const v=field.querySelector('input[value="'+old.selected+'"]');
      const t=confidenceField.querySelector('input[value="'+old.confidence+'"]');
      if(v)v.checked=true;if(t)t.checked=true;
    }
    function persistDraft() {
      const selected=field.querySelector("input:checked"),conf=confidenceField.querySelector("input:checked");
      localStorage.setItem(pending,JSON.stringify({selected:selected?.value||null,confidence:conf?.value||null}));
    }
    field.addEventListener("change",persistDraft);
    confidenceField.addEventListener("change",persistDraft);
    async function recover() {
      if(!SILENCIADO.readApi)return;
      const saved=JSON.parse(localStorage.getItem(key)||"null");
      if(!saved?.id || !saved?.session)return;
      const u=SILENCIADO.readApi.replace(/\/$/,"")+"/"+encodeURIComponent(saved.id)+"?anon_session_id="+encodeURIComponent(saved.session);
      const r=await fetch(u,{cache:"no-store"});
      if(!r.ok)return;
      const v=await r.json();
      if(v.question_id!==item.question_id || v.persisted!==true)return;
      const picked=field.querySelector('input[value="'+v.selected_option+'"]');
      const conf=confidenceField.querySelector('input[value="'+v.confidence+'"]');
      if(picked)picked.checked=true;if(conf)conf.checked=true;
      submit.disabled=true; status.textContent="Tentativa recuperada do servidor: "+v.selected_option+" · confiança "+v.confidence+"/5.";
    }
    try { await recover(); } catch (_) { status.textContent="Tentativa ainda não recuperada do servidor."; }
    form.addEventListener("submit",async (event)=>{
      event.preventDefault();
      if(submit.disabled)return;
      const sel=field.querySelector("input:checked"),conf=confidenceField.querySelector("input:checked");
      if(!sel||!conf){status.textContent="Selecione alternativa e confiança.";return;}
      if(!SILENCIADO.api){status.textContent="Servidor de tentativas indisponível.";return;}
      submit.disabled=true;status.textContent="Enviando ao servidor…";
      const attempt=idTentativa(item.question_id);
      try{
        const endpoint=SILENCIADO.api.replace(/\/$/,"");
        const session=sessaoAnonima();
        const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":/script\.google\.com$/i.test(new URL(endpoint).hostname)?"text/plain;charset=utf-8":"application/json;charset=utf-8"},body:JSON.stringify({question_id:item.question_id,selected_option:sel.value,confidence:Number(conf.value),client_attempt_id:attempt.id,anon_session_id:session})});
        if(!r.ok)throw new Error("HTTP "+r.status);
        const result=await r.json();
        if(result.persisted!==true)throw new Error("Sem confirmação de persistência");
        localStorage.setItem(key,JSON.stringify({id:attempt.id,session}));
        if(attempt.chave)sessionStorage.removeItem(attempt.chave);
        status.textContent="Resposta registrada no servidor. "+(result.correct===true?"Correta.":result.correct===false?"Incorreta.":"");
      }catch(err){submit.disabled=false;status.textContent="Falha no envio: "+err.message;}
    });
    section.append(h,content,form);sheet.append(section);
  }
  if (c.pagina === 5) {
    const heading=document.createElement("div");
    heading.className="pagina-p5-head";
    heading.textContent="LINGUAGENS, CÓDIGOS E SUAS TECNOLOGIAS · Questões de 06 a 45";
    sheet.prepend(heading);
    const q7=sheet.querySelector(".pagina-q7");
    if (!q7) throw new Error("Q007 ausente da página 5");
    const source=q7.querySelector(".pagina-blocos");
    const paras=Array.from(source.children);
    if (paras.length!==6 || !paras[2].textContent.startsWith("Elizabeth Gomes:")) {
      throw new Error("Contrato de fragmentação de coluna da Q007 não reconhecido");
    }
    const marker="até optar pelas provas de campo em 2010.";
    const full=paras[2].textContent;
    const split=full.indexOf(marker);
    if (split<0 || !full.includes("classe F52")) throw new Error("Transição da Q007 entre colunas não conferida");
    paras[2].textContent=full.slice(0,split).trim();
    const continuation=document.createElement("section");
    continuation.className="pagina-questao pagina-q7-continued";
    continuation.setAttribute("aria-label","Continuação da questão 7");
    const continuing=document.createElement("div");
    continuing.className="pagina-blocos";
    const rest=document.createElement("p");
    rest.dataset.role="passage";
    rest.textContent=full.slice(split);
    continuing.append(rest);
    for (const node of paras.slice(3)) continuing.append(node);
    const form=q7.querySelector("form");
    if (!form) throw new Error("Tentativa Q007 não encontrada");
    continuation.append(continuing,form);
    sheet.append(continuation);
    q7.classList.add("pagina-q7-left");
  }

  if (c.pagina === 7) {
    const q13=sheet.querySelector(".pagina-q13");
    if (!q13) throw new Error("Q013 ausente da página 7");
    const content=q13.querySelector(".pagina-blocos");
    const paras=Array.from(content.children);
    if(paras.length!==5 || !paras[0].textContent.startsWith("Diante do pouco dinheiro")
       || !paras[2].textContent.startsWith("Dados da ONU")) {
      throw new Error("Contrato de fragmentação de coluna da Q013 não reconhecido");
    }
    const continuation=document.createElement("section");
    continuation.className="pagina-questao pagina-q13-continued";
    continuation.setAttribute("aria-label","Continuação da questão 13");
    const continuing=document.createElement("div");
    continuing.className="pagina-blocos";
    for(const node of paras.slice(2)) continuing.append(node);
    const form=q13.querySelector("form");
    if(!form) throw new Error("Formulário Q013 ausente");
    continuation.append(continuing,form);
    sheet.append(continuation);
    q13.classList.add("pagina-q13-left");
  }
  for (const image of sheet.querySelectorAll("img")) {
    image.addEventListener("load",atualizarZoom);
  }
  atualizarZoom();
  const card=document.getElementById("card");
  card.replaceChildren(header,stage);
  // A folha precisa estar no DOM antes de medir scrollHeight.
  atualizarZoom();
  requestAnimationFrame(atualizarZoom);
  card.classList.add("pagina-mode");
  document.querySelector("main").classList.add("pagina-main");
  document.getElementById("fonte").textContent="Fonte: INEP, 2024_PV_impresso_D1_CD1.pdf, página "+c.pagina+". Modo página estruturado sem imagem de fundo.";
}

async function iniciar() {
  const params = new URLSearchParams(location.search);
  const id = (params.get("id") || "").trim();
  const occ = {
    ano: intOrUndef(params.get("ano")),
    dia: intOrUndef(params.get("dia")),
    caderno: (params.get("caderno") || "").trim().toLowerCase(),
    cor: (params.get("cor") || "").trim().toLowerCase(),
    idioma: normIdioma(params.get("idioma")) || undefined,
    numero: intOrUndef(params.get("numero") || params.get("n")),
  };
  const resultado = document.getElementById("resultado");

  let catalogo;
  try {
    catalogo = await (await fetch("catalogo.json", { cache: "no-store" })).json();
  } catch (_) {
    falha("Não foi possível carregar o catálogo público.");
    return;
  }
  const items = catalogo.items || [];
  const pagina = intOrUndef(params.get("pagina"));
  if (pagina !== undefined) {
    const p = CONFIG_PAGINAS_2024_D1[pagina];
    if (!p || occ.ano!==p.ano || occ.dia!==p.dia ||
        occ.caderno!==p.caderno || occ.idioma!==p.idioma) {
      falha("Página ou variante ainda não reconstruída.");
      return;
    }
    try { await abrirPaginaEstruturada(items,p); }
    catch(e) { falha("Página estruturada indisponível: "+e.message); }
    return;
  }

  const porId = acharItemPorId(items, id);
  let item = porId.item;
  let candidatos = porId.matches;

  if (!item) {
    const porOcc = filtrarPorOcorrencia(items, occ);
    if (porOcc.length === 1) {
      item = porOcc[0];
      candidatos = porOcc;
    } else if (porOcc.length > 1) {
      const meta = document.getElementById("meta");
      meta.innerHTML = "";
      const p = document.createElement("p");
      p.textContent = "Mais de uma questão coincide com essa combinação. Escolha:";
      p.style.margin = "0 0 .4rem";
      meta.appendChild(p);
      const ul = document.createElement("ul");
      for (const i2 of porOcc) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "questao.html?id=" + encodeURIComponent(i2.id);
        a.textContent = descreverItem(i2);
        li.appendChild(a);
        ul.appendChild(li);
      }
      meta.appendChild(ul);
      mostrar(document.getElementById("figura"), false);
      mostrar(document.getElementById("figura_texto"), false);
      mostrar(document.getElementById("form-resposta"), false);
      return;
    }
  }
  if (!item) { falha("Questão não encontrada no catálogo público."); return; }

  const pageLink=linkDaPagina(item);
  if(pageLink){
    const anchor=document.createElement("a");anchor.href=pageLink;anchor.className="pagina-link";anchor.textContent="Ver página "+item.pagina+" interativa";
    document.getElementById("card").prepend(anchor);
  }
  document.title = "Sistema ENEM — Questão " + item.numero_oficial + " (" + item.ano + ")";
  const meta = document.getElementById("meta");
  meta.innerHTML = "<strong>Questão " + item.numero_oficial + "</strong> · " + item.prova +
    ", página " + item.pagina + " · " + item.area +
    (item.anulada ? '<span class="badge">ANULADA pelo INEP</span>' : "");

  const imgTexto = document.getElementById("enunciado_texto");
  if (item.imagem_texto) {
    imgTexto.src = item.imagem_texto;
    imgTexto.alt = item.alt_texto || ("Texto-base da questão " + item.numero_oficial + " do ENEM " + item.ano + ".");
    mostrar(document.getElementById("figura_texto"), true);
  }

  const img = document.getElementById("enunciado");
  img.src = item.imagem;
  img.alt = item.alt || ("Questão " + item.numero_oficial + " do ENEM " + item.ano + ".");
  mostrar(document.getElementById("figura"), true);

  document.getElementById("fonte").textContent =
    "Fonte oficial: " + item.fonte + ", página " + item.pagina +
    ". SHA-256 do ativo de imagem: " + (item.sha256_imagem || "não informado") + ".";

  let dados;
  try {
    dados = await (await fetch(item.data, { cache: "no-store" })).json();
  } catch (_) {
    falha("Não foi possível carregar as alternativas.");
    return;
  }

  // Reconstrução em blocos; o recorte da fonte é apenas um fallback consultável.
  // Questões históricas apenas com screenshot mantêm seu comportamento anterior.
  const structured = document.getElementById("conteudo-estruturado");
  const hasRealBlocks = Array.isArray(dados.blocks) && dados.blocks.some((b) =>
    ["text", "math", "table"].includes(b.type) ||
    (b.type === "image" && b.asset && b.asset !== item.imagem)
  );
  if (hasRealBlocks) {
    structured.textContent = "";
    renderizarBlocosComuns(structured,dados.blocks);
    mostrar(structured, true);
    mostrar(document.getElementById("figura"), false);
    mostrar(document.getElementById("figura_texto"), false);
    const original = document.getElementById("alternar-original");
    mostrar(original, true);
    original.addEventListener("click", () => {
      const showing = !document.getElementById("figura").hidden;
      mostrar(document.getElementById("figura"), !showing);
      original.textContent = showing ? "Consultar recorte original" : "Ocultar recorte original";
    });
  }

  const container = document.getElementById("alternativas");
  container.textContent = "";
  for (const opcao of dados.options || []) {
    const label = document.createElement("label");
    label.className = "option";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "alternativa";
    input.value = opcao.label;
    input.setAttribute("aria-label", "Alternativa " + opcao.label + ": " + opcao.text);
    label.appendChild(input);
    label.appendChild(document.createTextNode(" " + opcao.label + " — " + opcao.text));
    container.appendChild(label);
  }
  mostrar(document.getElementById("form-resposta"), true);

  const confiancaContainer = document.getElementById("confianca");
  for (let i = 1; i <= 5; i += 1) {
    const rotulo = document.createElement("label");
    rotulo.className = "option";
    rotulo.style.margin = "0";
    const entrada = document.createElement("input");
    entrada.type = "radio";
    entrada.name = "confianca";
    entrada.value = String(i);
    entrada.setAttribute("aria-label", "Confiança " + i + " de 5");
    rotulo.appendChild(entrada);
    rotulo.appendChild(document.createTextNode(" " + i));
    confiancaContainer.appendChild(rotulo);
  }

  // Rascunho compartilhado com o modo página; confirmação sempre vem do servidor.
  const rascunhoKey = "sistema_enem_rascunho_" + item.question_id;
  try {
    const rascunho = JSON.parse(localStorage.getItem(rascunhoKey) || "null");
    if (rascunho?.selected) {
      const selected = container.querySelector('input[value="' + rascunho.selected + '"]');
      if (selected) selected.checked = true;
    }
    if (rascunho?.confidence) {
      const confidence = confiancaContainer.querySelector('input[value="' + rascunho.confidence + '"]');
      if (confidence) confidence.checked = true;
    }
    function salvarRascunho() {
      const option = container.querySelector("input:checked");
      const confidence = confiancaContainer.querySelector("input:checked");
      localStorage.setItem(rascunhoKey, JSON.stringify({
        selected: option?.value || null, confidence: confidence?.value || null
      }));
    }
    container.addEventListener("change", salvarRascunho);
    confiancaContainer.addEventListener("change", salvarRascunho);
  } catch (_) { /* sem armazenamento: formulário ainda funciona */ }

  const chave = primeiraChave(item.question_id);
  let primeira = null;
  try { primeira = localStorage.getItem(chave); } catch (_) { primeira = null; }

  // Na validação autorizada, uma tentativa confirmada pode ser recuperada
  // do servidor após recarregar; localStorage guarda somente IDs, não é prova.
  const reciboKey = "sistema_enem_recibo_" + item.question_id;
  if (SILENCIADO.readApi) {
    try {
      const saved = JSON.parse(localStorage.getItem(reciboKey) || "null");
      if (saved && saved.id && saved.session) {
        const url = SILENCIADO.readApi.replace(/\/$/, "") + "/" +
          encodeURIComponent(saved.id) + "?anon_session_id=" + encodeURIComponent(saved.session);
        const retrieved = await fetch(url, {cache: "no-store"});
        if (retrieved.ok) {
          const body = await retrieved.json();
          if (body.question_id === item.question_id && body.persisted === true) {
            const oldOption = document.querySelector('input[name="alternativa"][value="' + body.selected_option + '"]');
            const oldConfidence = document.querySelector('input[name="confianca"][value="' + body.confidence + '"]');
            if (oldOption) oldOption.checked = true;
            if (oldConfidence) oldConfidence.checked = true;
            resultado.className = "ok";
            resultado.style.display = "block";
            resultado.textContent = "Tentativa anterior recuperada do servidor. Alternativa " +
              body.selected_option + " (confiança " + body.confidence + "/5). " +
              (body.correct === true ? "Correta." : body.correct === false ? "Incorreta." : "");
          }
        }
      }
    } catch (_) { /* tentativa ainda não confirmada ou backend indisponível */ }
  }

  document.getElementById("form-resposta").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const selecionada = document.querySelector('input[name="alternativa"]:checked');
    resultado.style.display = "block";
    resultado.className = "";
    if (!selecionada) {
      resultado.textContent = "Selecione uma alternativa antes de registrar.";
      return;
    }
    const confianca = document.querySelector('input[name="confianca"]:checked');
    if (SILENCIADO.api && !confianca) {
      resultado.textContent = "Selecione sua confiança de 1 a 5 antes de registrar.";
      return;
    }
    if (primeira === null) {
      try { localStorage.setItem(chave, selecionada.value); } catch (_) { /* sem armazenamento local */ }
      primeira = selecionada.value;
    }

    if (!SILENCIADO.api) {
      resultado.textContent = "Resposta registrada neste navegador. A conferência e o feedback acontecem no servidor; o feedback ainda não está disponível nesta página.";
      return;
    }
    resultado.textContent = "Enviando ao servidor…";
    const tentativa = idTentativa(item.question_id);
    const endpoint = SILENCIADO.api.replace(/\/$/, "");
    try {
      // Application/json exigiria preflight CORS que o endpoint gratuito nao responde;
      // text/plain (simple request) e lido pelo servidor como JSON.
      const resposta = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": /script\.google\.com$/i.test(new URL(endpoint).hostname)
          ? "text/plain;charset=utf-8" : "application/json;charset=utf-8" },
        body: JSON.stringify({
          question_id: item.question_id,
          selected_option: selecionada.value,
          confidence: confianca ? Number(confianca.value) : 3,
          client_attempt_id: tentativa.id,
          anon_session_id: sessaoAnonima(),
        }),
      });
      if (!resposta.ok) {
        resultado.className = "erro";
        resultado.textContent = "Não foi possível registrar no servidor agora (HTTP " + resposta.status + "). Sua resposta ficou guardada neste navegador.";
        return;
      }
      try { if (tentativa.chave) sessionStorage.removeItem(tentativa.chave); } catch (_) { /* sem sessionStorage */ }
      const corpo = await resposta.json();
      if (corpo.persisted === true) {
        try { localStorage.setItem(reciboKey, JSON.stringify({
          id: tentativa.id, session: sessaoAnonima()
        })); } catch (_) { /* sem armazenamento local: servidor já persistiu */ }
      }
      resultado.className = "ok";
      if (corpo.official_status === "annulled") {
        resultado.textContent = "Questão anulada pelo INEP: não há alternativa correta. Sua tentativa foi registrada no servidor.";
      } else if (corpo.correct === true) {
        resultado.textContent = "Resposta registrada no servidor. Correta!";
      } else if (corpo.correct === false) {
        resultado.textContent = "Resposta registrada no servidor. Incorreta.";
      } else {
        resultado.textContent = "Resposta registrada no servidor.";
      }
    } catch (_) {
      resultado.className = "erro";
      resultado.textContent = "Falha de conexão com o servidor. Sua resposta ficou guardada neste navegador.";
    }
  });
}

iniciar();
</script>
