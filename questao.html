<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sistema ENEM — questão pública do ENEM (INEP), sem gabarito exposto">
<title>Sistema ENEM — Questão</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f5f7; color: #17181c; line-height: 1.5; }
  header { background: #0d2b45; color: #fff; padding: 1rem 1.25rem; }
  header h1 { margin: 0; font-size: 1.1rem; font-weight: 650; letter-spacing: .02em; }
  header a { color: #bcd3e8; text-decoration: none; font-size: .85rem; }
  main { max-width: 880px; margin: 1.25rem auto; padding: 0 1rem; }
  .card { background: #fff; border-radius: 12px; padding: 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .meta { color: #4a5568; font-size: .85rem; margin: 0 0 .75rem; }
  .meta strong { color: #0d2b45; }
  .badge { display: inline-block; background: #8b5200; color: #fff; border-radius: 6px; padding: .1rem .5rem; font-size: .75rem; font-weight: 700; margin-left: .4rem; vertical-align: middle; }
  figure { margin: 1rem 0; }
  figure img { max-width: 100%; height: auto; border: 1px solid #e2e5ea; border-radius: 8px; }
  figcaption { font-size: .8rem; color: #4a5568; margin-top: .4rem; }
  fieldset { border: 0; padding: 0; margin: 1rem 0 0; }
  legend { font-weight: 600; margin-bottom: .5rem; }
  label.option { display: block; border: 1px solid #d6dbe3; border-radius: 10px; padding: .65rem .8rem; margin: .45rem 0; cursor: pointer; transition: border-color .15s, background .15s; }
  label.option:hover { border-color: #0d2b45; background: #f7fafd; }
  label.option input { margin-right: .6rem; }
  button { background: #0d2b45; color: #fff; border: 0; border-radius: 10px; padding: .7rem 1.4rem; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: .5rem; }
  button:hover { background: #14405f; }
  #resultado { margin-top: 1rem; padding: .75rem .9rem; border-radius: 10px; font-weight: 600; display: none; background: #eef2f7; color: #2d3748; border: 1px solid #cbd5e0; }
  #resultado.ok { background: #ecf8ef; color: #1e5b2a; border-color: #b6dfc2; }
  #resultado.erro { background: #fdf0ee; color: #7a2415; border-color: #f2c0b3; }
  footer { max-width: 880px; margin: 1rem auto 2rem; padding: 0 1rem; font-size: .72rem; color: #718096; }
</style>
</head>
<body>
<header><h1>Sistema ENEM</h1><a href="index.html">&larr; Índice de questões</a></header>
<main>
  <div class="card" id="card">
    <p class="meta" id="meta">Carregando…</p>
    <figure id="figura_texto" hidden>
      <img id="enunciado_texto" alt="">
      <figcaption>Texto-base compartilhado (autoria INEP), exibido sem qualquer alteração.</figcaption>
    </figure>
    <figure id="figura" hidden>
      <img id="enunciado" alt="">
      <figcaption>Imagem oficial integral da questão (autoria INEP), exibida sem qualquer alteração.</figcaption>
    </figure>
    <form id="form-resposta" aria-label="Registrar resposta" hidden>
      <fieldset>
        <legend>Selecione uma alternativa</legend>
        <div id="alternativas"></div>
      </fieldset>
      <fieldset>
        <legend>Sua confiança</legend>
        <div id="confianca" style="display:flex; gap:.4rem; flex-wrap:wrap"></div>
      </fieldset>
      <button type="submit">Registrar minha resposta</button>
    </form>
    <div id="resultado" role="status" aria-live="polite"></div>
  </div>
</main>
<footer>
  <p id="fonte">Fonte oficial: INEP.</p>
  <p>A alternativa correta não é exibida nem conferida nesta página; a conferência acontece no sistema, no servidor.</p>
</footer>
<script src="config.js"></script>
<script>
const SILENCIADO = { api: (window.SISTEMA_ENEM_API || "").trim() };

function mostrar(el, visivel) { el.hidden = !visivel; }

function intOrUndef(v) {
  if (v === null || v === undefined) return undefined;
  const s = String(v).trim();
  if (!s) return undefined;
  const n = Number(s);
  return Number.isFinite(n) ? n : undefined;
}

const IDIOMA_ALIASES = {
  "english": "en",
  "en": "en",
  "espanol": "es",
  "español": "es",
  "es": "es",
  "portugues": "pt",
  "português": "pt",
  "pt-br": "pt",
  "pt": "pt"
};

function normIdioma(v) {
  const s = String(v || "").trim().toLowerCase();
  if (!s) return "";
  return IDIOMA_ALIASES[s] || s;
}

function acharItemPorId(items, id) {
  if (!id) return { item: null, matches: [] };
  const direct = items.filter((i) => i.id === id || i.question_id === id);
  if (direct.length) {
    return { item: direct.length === 1 ? direct[0] : null, matches: direct };
  }
  const byAlias = items.filter((i) => (i.aliases || []).includes(id));
  if (byAlias.length === 1) return { item: byAlias[0], matches: byAlias };
  return { item: null, matches: byAlias };
}

function filtrarPorOcorrencia(items, occ) {
  const matches = items.filter((i) => {
    const o = i.occurrence || {};
    const campos = [];
    if (occ.ano) campos.push(() => String(o.ano) === String(occ.ano));
    if (occ.dia) campos.push(() => String(o.dia) === String(occ.dia));
    if (occ.caderno) campos.push(() => String(o.caderno || "") === String(occ.caderno));
    if (occ.cor) campos.push(() => String(o.cor || "") === String(occ.cor));
    if (occ.idioma) campos.push(() => normIdioma(o.idioma) === occ.idioma);
    if (occ.numero) campos.push(() => String(o.numero_oficial) === String(occ.numero));
    return campos.every((c) => c());
  });
  return matches;
}

function descreverItem(i) {
  const o = i.occurrence || {};
  const idioma = o.idioma ? " (" + o.idioma + ")" : "";
  return "Questão " + (o.numero_oficial != null ? o.numero_oficial : i.numero_oficial) + idioma + " · " + (i.prova || "");
}

function falha(mensagem) {
  const meta = document.getElementById("meta");
  meta.textContent = mensagem;
  mostrar(document.getElementById("figura"), false);
  mostrar(document.getElementById("figura_texto"), false);
  mostrar(document.getElementById("form-resposta"), false);
}

// Recursos publicos precisam permanecer na arvore local da demo.
// Nao aceitar URLs externas, caminhos absolutos, travessia ou query strings.
function recursoLocalSeguro(value, pasta, extensao) {
  if (typeof value !== "string") return false;
  const safeName = "[A-Za-z0-9_-][A-Za-z0-9_.-]*";
  return new RegExp("^" + pasta + "/" + safeName + "\\." + extensao + "$").test(value);
}

// Mesma regra textual aplicada no Apps Script v15. Nunca tentar enviar um
// identificador local corrompido: o servidor rejeitaria e o cliente ficaria
// repetindo uma requisicao impossivel de confirmar.
function identificadorValido(value, minLen, maxLen) {
  return typeof value === "string" && value.length >= minLen &&
    value.length <= maxLen && /^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(value);
}

function primeiraChave(questionId) { return "sistema_enem_primeira_" + questionId; }

function sessaoAnonima() {
  try {
    let s = localStorage.getItem("sistema_enem_anon_session");
    if (!s) {
      s = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(16).slice(2));
      localStorage.setItem("sistema_enem_anon_session", s);
    }
    return identificadorValido(s, 8, 128) ? s : undefined;
  } catch (_) { return undefined; }
}

// A resposta HTTP 200, isoladamente, nao comprova persistencia no Apps Script.
// Um replay com persisted=false pode existir no banco; sem recibo inequivoco,
// mantenha o nonce para reconsulta/reenvio idempotente, em vez de inventar sucesso.
function reciboPersistido(corpo, questionId, attemptId) {
  if (!corpo || typeof corpo !== "object" || Array.isArray(corpo)) return false;
  if (corpo.error != null && corpo.error !== "") return false;
  if (corpo.ok === false || corpo.status === "error") return false;
  // O recibo precisa vincular explicitamente esta questao e este UUID.
  // Afirmar persisted=true sem identidade permite falso positivo de outro envio.
  if (corpo.question_id !== questionId) return false;
  if (corpo.client_attempt_id !== attemptId) return false;
  // O contrato do Apps Script emite um identificador opaco do registro persistido.
  // Um simples eco de question_id/client_attempt_id nao constitui recibo de gravação.
  if (typeof corpo.attempt_receipt !== "string" ||
      corpo.attempt_receipt.trim().length < 8) return false;
  return corpo.persisted === true;
}

// O mesmo nonce nunca deve ser reutilizado com alternativa/confianca diferente.
// Sem armazenamento de sessao, interromper o envio: nao ha replay seguro.
function reservarPayloadTentativa(tentativa, payload) {
  if (!tentativa.chave) return "armazenamento_indisponivel";
  const chavePayload = tentativa.chave + "_payload";
  const assinatura = JSON.stringify({
    selected_option: payload.selected_option,
    confidence: payload.confidence,
    anon_session_id: payload.anon_session_id,
  });
  try {
    const anterior = sessionStorage.getItem(chavePayload);
    if (anterior !== null) return anterior === assinatura ? null : "payload_divergente";
    sessionStorage.setItem(chavePayload, assinatura);
    return null;
  } catch (_) {
    return "armazenamento_indisponivel";
  }
}

function idTentativa(questionId) {
  // Um clique = um envio; o mesmo UUID e reutilizado em reenvios da mesma submissao
  // (falha de rede), garantindo idempotencia no servidor. Liberado apos sucesso.
  const chave = "sistema_enem_attempt_" + questionId;
  const novo = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(16).slice(2));
  try {
    let s = sessionStorage.getItem(chave);
    if (!s) { s = novo(); sessionStorage.setItem(chave, s); }
    return { id: s, chave };
  } catch (_) { return { id: novo(), chave: null }; }
}

async function iniciar() {
  const params = new URLSearchParams(location.search);
  // Um numero invalido ou um parametro repetido nao e um filtro ausente.
  // Falhar antes de selecionar outra ocorrencia, inclusive quando existe id.
  const numericos = ["ano", "dia", "numero", "n"];
  const numericoInvalido = numericos.some((campo) => {
    const valores = params.getAll(campo);
    return valores.length > 1 || valores.some((valor) => {
      const texto = valor.trim();
      return !/^[1-9][0-9]*$/.test(texto) ||
        !Number.isSafeInteger(Number(texto));
    });
  });
  if (numericoInvalido || (params.has("numero") && params.has("n")) ||
      params.getAll("id").length > 1) {
    falha("Filtros numéricos inválidos, duplicados ou conflitantes na URL.");
    return;
  }
  const id = (params.get("id") || "").trim();
  const occ = {
    ano: intOrUndef(params.get("ano")),
    dia: intOrUndef(params.get("dia")),
    caderno: (params.get("caderno") || "").trim().toLowerCase(),
    cor: (params.get("cor") || "").trim().toLowerCase(),
    idioma: normIdioma(params.get("idioma")) || undefined,
    numero: intOrUndef(params.get("numero") || params.get("n")),
  };
  const resultado = document.getElementById("resultado");

  let catalogo;
  try {
    catalogo = await (await fetch("catalogo.json", { cache: "no-store" })).json();
  } catch (_) {
    falha("Não foi possível carregar o catálogo público.");
    return;
  }
  const items = catalogo.items || [];

  const porId = acharItemPorId(items, id);
  let item = porId.item;
  let candidatos = porId.matches;
  const filtrosInformados = Object.values(occ).some((v) =>
    v !== undefined && v !== null && v !== ""
  );

  // Identificadores explicitos nunca podem cair em uma ocorrencia diferente.
  // Se o ID apontar a varios aliases, limitar a busca apenas aos candidatos.
  if (id && candidatos.length === 0) {
    falha("Identificador de questão não encontrado no catálogo público.");
    return;
  }
  if (item && filtrosInformados && filtrarPorOcorrencia([item], occ).length !== 1) {
    falha("Identificador e filtros de ocorrência não correspondem à mesma questão.");
    return;
  }
  if (!item && !id && !filtrosInformados) {
    falha("Informe o identificador ou os filtros da questão.");
    return;
  }

  if (!item) {
    const porOcc = filtrarPorOcorrencia(id ? candidatos : items, occ);
    if (porOcc.length === 1) {
      item = porOcc[0];
      candidatos = porOcc;
    } else if (porOcc.length > 1) {
      const meta = document.getElementById("meta");
      meta.innerHTML = "";
      const p = document.createElement("p");
      p.textContent = "Mais de uma questão coincide com essa combinação. Escolha:";
      p.style.margin = "0 0 .4rem";
      meta.appendChild(p);
      const ul = document.createElement("ul");
      for (const i2 of porOcc) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "questao.html?id=" + encodeURIComponent(i2.id);
        a.textContent = descreverItem(i2);
        li.appendChild(a);
        ul.appendChild(li);
      }
      meta.appendChild(ul);
      mostrar(document.getElementById("figura"), false);
      mostrar(document.getElementById("figura_texto"), false);
      mostrar(document.getElementById("form-resposta"), false);
      return;
    }
  }
  if (!item) { falha("Questão não encontrada no catálogo público."); return; }
  if (!recursoLocalSeguro(item.data, "data", "json") ||
      !recursoLocalSeguro(item.imagem, "assets", "png") ||
      (item.imagem_texto != null && item.imagem_texto !== "" &&
       !recursoLocalSeguro(item.imagem_texto, "assets", "png"))) {
    falha("Referências de arquivos da questão inválidas ou externas. Registro bloqueado.");
    return;
  }

  document.title = "Sistema ENEM — Questão " + item.numero_oficial + " (" + item.ano + ")";
  const meta = document.getElementById("meta");
  // Metadados do catalogo sao conteudo, nunca codigo HTML executavel.
  // Criar nos DOM explicitamente impede injecao de marcacao por campos JSON.
  meta.textContent = "";
  const tituloQuestao = document.createElement("strong");
  tituloQuestao.textContent = "Questão " + item.numero_oficial;
  meta.appendChild(tituloQuestao);
  meta.appendChild(document.createTextNode(
    " · " + item.prova + ", página " + item.pagina + " · " + item.area
  ));
  if (item.anulada) {
    const selo = document.createElement("span");
    selo.className = "badge";
    selo.textContent = "ANULADA pelo INEP";
    meta.appendChild(selo);
  }

  const imgTexto = document.getElementById("enunciado_texto");
  if (item.imagem_texto) {
    imgTexto.src = item.imagem_texto;
    imgTexto.alt = item.alt_texto || ("Texto-base da questão " + item.numero_oficial + " do ENEM " + item.ano + ".");
    mostrar(document.getElementById("figura_texto"), true);
  }

  const img = document.getElementById("enunciado");
  img.src = item.imagem;
  img.alt = item.alt || ("Questão " + item.numero_oficial + " do ENEM " + item.ano + ".");
  mostrar(document.getElementById("figura"), true);

  document.getElementById("fonte").textContent =
    "Fonte oficial: " + item.fonte + ", página " + item.pagina +
    ". SHA-256 do ativo de imagem: " + (item.sha256_imagem || "não informado") + ".";

  let dados;
  try {
    dados = await (await fetch(item.data, { cache: "no-store" })).json();
  } catch (_) {
    falha("Não foi possível carregar as alternativas.");
    return;
  }

  // Nao combinar alternativas de um arquivo com o question_id de outro item.
  // A verificacao e local, sem obter ou expor qualquer gabarito.
  const opcoes = dados && dados.options;
  const rotulos = Array.isArray(opcoes) ? opcoes.map((o) => o && o.label) : [];
  const dadosValidos = dados && dados.question_id === item.question_id &&
    Array.isArray(opcoes) && opcoes.length === 5 &&
    rotulos.every((r) => typeof r === "string" && /^[A-E]$/.test(r)) &&
    new Set(rotulos).size === 5 &&
    opcoes.every((o) => o && typeof o.text === "string");
  if (!dadosValidos) {
    falha("Alternativas incompatíveis com a identidade da questão. Registro bloqueado.");
    return;
  }

  const container = document.getElementById("alternativas");
  container.textContent = "";
  for (const opcao of opcoes) {
    const label = document.createElement("label");
    label.className = "option";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "alternativa";
    input.value = opcao.label;
    input.setAttribute("aria-label", "Alternativa " + opcao.label + ": " + opcao.text);
    label.appendChild(input);
    label.appendChild(document.createTextNode(" " + opcao.label + " — " + opcao.text));
    container.appendChild(label);
  }
  mostrar(document.getElementById("form-resposta"), true);

  const confiancaContainer = document.getElementById("confianca");
  for (let i = 1; i <= 5; i += 1) {
    const rotulo = document.createElement("label");
    rotulo.className = "option";
    rotulo.style.margin = "0";
    const entrada = document.createElement("input");
    entrada.type = "radio";
    entrada.name = "confianca";
    entrada.value = String(i);
    entrada.setAttribute("aria-label", "Confiança " + i + " de 5");
    rotulo.appendChild(entrada);
    rotulo.appendChild(document.createTextNode(" " + i));
    confiancaContainer.appendChild(rotulo);
  }

  const chave = primeiraChave(item.question_id);
  let primeira = null;
  try { primeira = localStorage.getItem(chave); } catch (_) { primeira = null; }

  // Restaurar apenas o formulario de uma tentativa local ainda nao confirmada.
  // Isto NAO demonstra que o servidor tenha gravado nem recuperado a tentativa.
  if (SILENCIADO.api) {
    try {
      const chavePendente = "sistema_enem_attempt_" + item.question_id;
      const noncePendente = sessionStorage.getItem(chavePendente);
      const assinatura = sessionStorage.getItem(chavePendente + "_payload");
      if (noncePendente && assinatura) {
        const anterior = JSON.parse(assinatura);
        const alternativaValida = /^[A-E]$/.test(anterior.selected_option || "");
        const confiancaValida = Number.isInteger(anterior.confidence) &&
          anterior.confidence >= 1 && anterior.confidence <= 5;
        const sessaoValida = typeof anterior.anon_session_id === "string" &&
          anterior.anon_session_id === sessaoAnonima();
        if (alternativaValida && confiancaValida && sessaoValida) {
          for (const rotulo of container.children) {
            const controle = rotulo.querySelector('input[name="alternativa"]');
            if (controle && controle.value === anterior.selected_option) controle.checked = true;
          }
          for (const rotulo of confiancaContainer.children) {
            const controle = rotulo.querySelector('input[name="confianca"]');
            if (controle && Number(controle.value) === anterior.confidence) controle.checked = true;
          }
          resultado.style.display = "block";
          resultado.className = "";
          resultado.textContent = "Envio anterior sem confirmação. Sua seleção foi restaurada; tente novamente para verificar o registro no servidor.";
        }
      }
    } catch (_) {
      // Sem estado local confiavel, nao inferir gravacao ou feedback remoto.
    }
  }

  let envioPendente = false;
  document.getElementById("form-resposta").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    if (envioPendente) return;
    const selecionada = document.querySelector('input[name="alternativa"]:checked');
    resultado.style.display = "block";
    resultado.className = "";
    if (!selecionada) {
      resultado.textContent = "Selecione uma alternativa antes de registrar.";
      return;
    }
    const confianca = document.querySelector('input[name="confianca"]:checked');
    if (SILENCIADO.api && !confianca) {
      resultado.textContent = "Selecione sua confiança de 1 a 5 antes de registrar.";
      return;
    }
    if (!SILENCIADO.api) {
      if (primeira === null) {
        try { localStorage.setItem(chave, selecionada.value); primeira = selecionada.value; }
        catch (_) {
          resultado.className = "erro";
          resultado.textContent = "Não foi possível guardar a resposta neste navegador.";
          return;
        }
      }
      resultado.textContent = "Resposta registrada neste navegador. A conferência e o feedback acontecem no servidor; o feedback ainda não está disponível nesta página.";
      return;
    }
    resultado.textContent = "Enviando ao servidor…";
    const tentativa = idTentativa(item.question_id);
    if (!identificadorValido(tentativa.id, 8, 80)) {
      resultado.className = "erro";
      resultado.textContent = "Identificador de tentativa local inválido. O envio foi bloqueado para não duplicar nem perder um registro pendente.";
      return;
    }
    const payload = {
      question_id: item.question_id,
      selected_option: selecionada.value,
      confidence: confianca ? Number(confianca.value) : 3,
      client_attempt_id: tentativa.id,
      anon_session_id: sessaoAnonima(),
    };
    if (!payload.anon_session_id) {
      resultado.className = "erro";
      resultado.textContent = "Não foi possível preservar a sessão anônima. O envio foi bloqueado para evitar perda de identidade da tentativa.";
      return;
    }
    const bloqueio = reservarPayloadTentativa(tentativa, payload);
    if (bloqueio) {
      resultado.className = "erro";
      resultado.textContent = bloqueio === "payload_divergente"
        ? "Existe um envio pendente para outra alternativa ou confiança. Restaure a seleção anterior para tentar novamente sem duplicação."
        : "Não foi possível guardar o identificador de tentativa nesta sessão. O envio foi bloqueado para evitar duplicação.";
      return;
    }
    const endpoint = SILENCIADO.api.replace(/\/$/, "");
    envioPendente = true;
    const botao = document.querySelector('#form-resposta button[type="submit"]');
    if (botao) botao.disabled = true;
    try {
      // Application/json exigiria preflight CORS que o endpoint gratuito nao responde;
      // text/plain (simple request) e lido pelo servidor como JSON.
      const resposta = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      if (!resposta.ok) {
        resultado.className = "erro";
        resultado.textContent = "Não foi possível registrar no servidor agora (HTTP " + resposta.status + "). Sua resposta ficou guardada neste navegador.";
        return;
      }
      const corpo = await resposta.json();
      if (!reciboPersistido(corpo, item.question_id, tentativa.id)) {
        throw new Error("RECIBO_PERSISTENCIA_NAO_CONFIRMADO");
      }
      try {
        if (tentativa.chave) {
          sessionStorage.removeItem(tentativa.chave + "_payload");
          sessionStorage.removeItem(tentativa.chave);
        }
      } catch (_) { /* sem sessionStorage */ }
      // A primeira resposta local so e registrada apos confirmacao do servidor.
      if (primeira === null) {
        try { localStorage.setItem(chave, selecionada.value); primeira = selecionada.value; }
        catch (_) { /* recibo remoto confirmado; armazenamento local opcional */ }
      }
      resultado.className = "ok";
      if (corpo.official_status === "annulled") {
        resultado.textContent = "Questão anulada pelo INEP: não há alternativa correta. Sua tentativa foi registrada no servidor.";
      } else if (corpo.correct === true) {
        resultado.textContent = "Resposta registrada no servidor. Correta!";
      } else if (corpo.correct === false) {
        resultado.textContent = "Resposta registrada no servidor. Incorreta.";
      } else {
        resultado.textContent = "Resposta registrada no servidor.";
      }
    } catch (_) {
      resultado.className = "erro";
      resultado.textContent = "Não foi possível confirmar a gravação no servidor. Ao tentar novamente, será usado o mesmo identificador para evitar duplicação.";
    } finally {
      envioPendente = false;
      if (botao) botao.disabled = false;
    }
  });
}

iniciar();
</script>
